name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Version to go back to
        required: true
        type: string

env:
  IMAGE_NAME: bhushanportpro/todo-app-backend
  SERVICE_NAME: todo-backend_backend

jobs:
  rollback:
    name: Rollback on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Check the tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$CURRENT_IMAGE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "current_image_tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Update service on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -e
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          if docker image inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Using the image already on EC2"
          else
            echo "Image is not on EC2, pulling it from Docker Hub"
            docker pull "$IMAGE_NAME:$IMAGE_TAG"
          fi
          docker service update --with-registry-auth --image "$IMAGE_NAME:$IMAGE_TAG" "$SERVICE_NAME"
          docker logout
          docker service ls
          EOF
