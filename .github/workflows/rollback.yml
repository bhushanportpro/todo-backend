name: Rollback

on:
  workflow_dispatch:

env:
  SERVICE_NAME: todo-backend_backend

jobs:
  rollback:
    name: Rollback on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Rollback to the previous image on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Save the SSH key in a file and lock it
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # ONE connection: everything between <<EOF and EOF runs on the EC2 server.
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -e
          echo "Image before rollback:"
          docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE_NAME"

          docker service rollback "$SERVICE_NAME"

          echo "Image after rollback:"
          docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE_NAME"
          docker service ls
          EOF