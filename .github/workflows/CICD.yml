name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: todo-backend-release
  cancel-in-progress: false

env:
  IMAGE_NAME: bhushanportpro/todo-app-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$({
            curl --fail --silent --show-error --retry 3 \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags?page_size=100&ordering=last_updated" \
              | node -e '
                  let input = "";
                  process.stdin.on("data", chunk => input += chunk);
                  process.stdin.on("end", () => {
                    const tags = JSON.parse(input).results
                      .map(tag => tag.name)
                      .map(tag => /^v(\\d+)(?:\\.(\\d+))?$/.exec(tag))
                      .filter(Boolean)
                      .map(match => ({ major: Number(match[1]), minor: match[2] === undefined ? null : Number(match[2]) }))
                      .sort((a, b) => b.major - a.major || (b.minor ?? -1) - (a.minor ?? -1));
                    if (tags.length === 0) {
                      process.stdout.write("v1.0");
                      return;
                    }
                    const current = tags[0];
                    if (current.minor === null) {
                      process.stdout.write(`v${current.major}.1`);
                    } else if (current.minor < 9) {
                      process.stdout.write(`v${current.major}.${current.minor + 1}`);
                    } else {
                      process.stdout.write(`v${current.major + 1}`);
                    }
                  });
                '
          })"
          echo "image_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:${latest_tag}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Pull image and deploy stack on EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DEPLOY_PATH: /home/${{ secrets.EC2_USER }}/todo-backend
          STACK_NAME: todo-backend
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,DEPLOY_PATH,STACK_NAME,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            printf "%s" "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            export IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
            docker pull "$IMAGE"
            docker stack deploy --with-registry-auth --prune --resolve-image always --compose-file docker-compose.yml "$STACK_NAME"
            docker logout
