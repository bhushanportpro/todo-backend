name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: todo-backend-release
  cancel-in-progress: false

env:
  IMAGE_NAME: bhushanportpro/todo-app-backend
  IMAGE_TAG: v${{ github.run_number }}
  SERVICE_NAME: todo-backend_backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"

      - name: Install dependencies and run tests
        run: docker run --rm -v "$PWD":/app -w /app node:24 sh -c "npm ci && npm test"

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

  release:
    name: Create GitHub release
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push.outputs.image_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Update service on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -e
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker image prune -af
          docker pull "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$IMAGE_TAG"
          docker service update --with-registry-auth --image "$IMAGE_NAME:latest" "$SERVICE_NAME"
          docker logout
          docker service ls
          EOF
